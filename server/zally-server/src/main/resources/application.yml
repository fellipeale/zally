spring:
  profiles:
    active: production
  datasource:
    url: jdbc:hsqldb:mem:storage;sql.syntax_pgs=true
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # created is a TIMESTAMP WITHOUT TIME ZONE holding UTC wall-clock time: read and write it as UTC
          time_zone: UTC
  oauth2:
    resource:
      tokenInfoUri: ${TOKEN_INFO_URI}

management:
  endpoint:
    health:
      probes:
        # Boot 4 enables the liveness/readiness groups by default, which adds "groups" to the /health body
        enabled: false
  endpoints:
    access.default: unrestricted
    web:
      base-path: /
      exposure:
        include: health, metrics
  server:
    port: ${MANAGEMENT_PORT:7979}

twintip:
  mapping: /api
  yaml: "classpath:/api/zally-api.yaml"

rules-config-path: "rules-config.conf"

zally:
  # rules to be ignored system wide by default
  ignoreRules: M008, M009, M010, M011, H001, H002, S005, S006, S007
  cli:
    releasesPage: https://github.com/zalando/zally/releases
    deprecatedCliAgents: unirest-java/1.3.11,Zally-CLI/1.0
