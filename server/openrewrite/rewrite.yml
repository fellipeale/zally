# OpenRewrite recipes for the Zally Spring Boot 2.7 -> 3.5 migration.
# Run them one at a time, in order, and commit after each (see README.md).
---
type: specs.openrewrite.org/v1beta/recipe
name: org.zalando.zally.migration.Boot2.Step1_Junit5
displayName: Zally Boot 2 migration, step 1 - JUnit 4 to JUnit 5 (still on Boot 2.7)
description: >
  Moves SpringRunner/SpringClassRule/@Rule based tests to JUnit 5 so junit-vintage-engine can be dropped.
  Runs on Boot 2.7, before any version bump.
recipeList:
  - org.openrewrite.java.spring.boot2.SpringBoot2JUnit4to5Migration

---
type: specs.openrewrite.org/v1beta/recipe
name: org.zalando.zally.migration.Boot2.Step2_Tooling
displayName: Zally Boot 2 migration, step 2 - Gradle wrapper and Kotlin plugins (still on Boot 2.7)
description: >
  Gradle 8.0-rc1 -> 8.14.x (needed by the Boot 4 plugin later) and the Kotlin Gradle plugins to 2.2.x.
  Dokka, Spotless/ktlint and kapt are NOT covered and have to be bumped by hand.
recipeList:
  - org.openrewrite.gradle.UpdateGradleWrapper:
      version: 8.14.x
      addIfMissing: false
  - org.openrewrite.text.FindAndReplace:
      # The Kotlin version lives in a local `val kotlinVersion` (root and zally-server build files) and the plugins
      # use the kotlin("jvm") shorthand, so UpgradePluginVersion with a plugin id pattern would not match.
      find: val kotlinVersion = "1.8.0"
      replace: val kotlinVersion = "2.2.21"
      filePattern: "**/*.gradle.kts"

---
type: specs.openrewrite.org/v1beta/recipe
name: org.zalando.zally.migration.Boot2.Step3_UpgradeTo35
displayName: Zally Boot 2 migration, step 3 - Spring Boot 2.7 to 3.5 (hand-picked subset)
description: >
  Deliberately NOT org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5. The dry run of that composite on Zally
  produced invalid Kotlin (Java-style `Foo.class`), half-converted security configs, a hard-pinned hibernate-core,
  a duplicated swagger-models-jakarta and a javax jaxb-api runtime dependency in every module.
  This keeps the parts that were correct: Boot plugin version, javax -> jakarta, and property migrations.
  Only the zally-server module is rewritten (see init.gradle).
recipeList:
  - org.openrewrite.text.FindAndReplace:
      # Not UpgradePluginVersion: that recipe also pins hibernate-core to the OLD managed version (5.6.14.Final).
      find: id("org.springframework.boot") version "2.7.7"
      replace: id("org.springframework.boot") version "3.5.16"
      filePattern: "**/zally-server/build.gradle.kts"
  - org.openrewrite.java.ChangePackage:
      oldPackageName: javax.persistence
      newPackageName: jakarta.persistence
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: javax.servlet
      newPackageName: jakarta.servlet
      recursive: true
  - org.openrewrite.java.spring.boot2.SpringBootProperties_2_4
  - org.openrewrite.java.spring.boot2.SpringBootProperties_2_7
  - org.openrewrite.java.spring.boot3.SpringBootProperties_3_0
  - org.openrewrite.java.spring.boot3.SpringBootProperties_3_4_EnabledToAccess
  - org.openrewrite.java.spring.boot3.SpringBootProperties_3_5

---
type: specs.openrewrite.org/v1beta/recipe
name: org.zalando.zally.migration.Boot2.Step3b_RemoveLegacyLibraries
displayName: Zally Boot 2 migration, step 3b - drop libraries that have no Boot 3 release (opt-in)
description: >
  These are unmaintained and javax based. Removing them breaks compilation on purpose; the replacements are
  manual: Spring Security resource server for stups-spring-oauth2-server, a small controller for twintip,
  ProblemDetail for problem-spring-web, native OffsetDateTime mapping for jadira usertype.
recipeList:
  - org.openrewrite.gradle.RemoveDependency:
      groupId: org.zalando.stups
      artifactId: stups-spring-oauth2-server
      configurations: implementation
  - org.openrewrite.gradle.RemoveDependency:
      groupId: org.zalando
      artifactId: twintip-spring-web
      configurations: implementation
  - org.openrewrite.gradle.RemoveDependency:
      groupId: org.zalando
      artifactId: problem-spring-web
      configurations: implementation
  - org.openrewrite.gradle.RemoveDependency:
      groupId: org.jadira.usertype
      artifactId: usertype.core
      configurations: implementation
